
name: Extract PartTrack Source

on:
  push:
    paths:
      - 'PartTrack-AI-Studio-Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q PartTrack-AI-Studio-Source.zip -d unpacked
          rsync -a unpacked/ ./
          rm -rf unpacked
          rm -f PartTrack-AI-Studio-Source.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore PartTrack source" || true
          git push
