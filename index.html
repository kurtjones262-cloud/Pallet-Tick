    <div id="root">
      <!-- Instant pre-React splash background so it displays first before anything else -->
      <div style="position:fixed;inset:0;background:#070A0F;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;">
        <div style="width:160px;height:160px;border-radius:24px;overflow:hidden;background:#000;border:1px solid rgba(6,182,212,0.3);box-shadow:0 0 40px rgba(0,168,255,0.35);margin-bottom:24px;">
          <img src="/pallettrack-icon.png" alt="PalletTick" style="width:100%;height:100%;object-fit:cover;" />
        </div>
        <p style="font-family:monospace;font-size:11px;font-weight:700;letter-spacing:0.28em;color:#22d3ee;text-transform:uppercase;margin-bottom:20px;">SCAN. TRACK. DELIVER.</p>
        <div style="font-family:monospace;font-size:12px;color:#a1a1aa;">Preparing your workspace...</div>
