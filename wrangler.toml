name = "pallet-tick"
main = "build/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve frontend static assets through Cloudflare Worker
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Relational Database Binding
# IMPORTANT: Replace "pallettrack-d1-placeholder-id" below with your actual
# Cloudflare D1 Database ID (UUID format, e.g. "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx")
# from Cloudflare Dashboard -> Storage & Databases -> D1 SQL Database -> pallettrack-db,
# or set the CLOUDFLARE_D1_DATABASE_ID secret in GitHub Actions.
[[d1_databases]]
binding = "DB"
database_name = "pallettrack-db"
database_id = "pallettrack-d1-placeholder-id"
migrations_dir = "migrations"

# Cloudflare Worker Environment Secrets:
# Configure GEMINI_API_KEY in the Cloudflare dashboard under:
# Workers & Pages -> Settings -> Variables and Secrets -> Add secret: GEMINI_API_KEY
# Or via CLI: wrangler secret put GEMINI_API_KEY

