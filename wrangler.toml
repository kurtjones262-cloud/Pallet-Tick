name = "pallet-tick"
main = "build/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve frontend static assets through Cloudflare Worker
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Relational Database Binding
[[d1_databases]]
binding = "DB"
database_name = "pallettrack-db"
database_id = "e18c4d0a-cb04-4b4b-8f5d-35b4430fbdbb"
migrations_dir = "migrations"

# Cloudflare Worker Environment Secrets (never commit plaintext secrets to wrangler.toml):
# 1. Configure GEMINI_API_KEY:
#    npx wrangler secret put GEMINI_API_KEY
# 2. Configure INITIAL_SETUP_SECRET (required for one-time first Super Admin provisioning, min 12 chars):
#    npx wrangler secret put INITIAL_SETUP_SECRET
# (Or configure under Cloudflare Dashboard -> Workers & Pages -> pallet-tick -> Settings -> Variables and Secrets)
